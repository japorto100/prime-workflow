[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "prime-workflow"
version = "0.1.0"
description = "Python client for the prime-workflow host bridge: durable run state for Prime RLM orchestration"
requires-python = ">=3.12"

[tool.hatch.build.targets.wheel]
packages = ["src/prime_workflow", "src/workflow"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
